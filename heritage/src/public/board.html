<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pip · Seeds</title>
<link rel="icon" href="data:,">
<style>
  @font-face{font-family:"Fredoka";src:url(assets/fonts/Fredoka.ttf) format("truetype");font-weight:300 700;font-display:swap}
  :root{--font-display:"Fredoka","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    --ink:#22303a;--muted:#5d5246;--paper:#efe3cd;--cream:#f8f1e3;--wood:#a9702f;--wood2:#7d5122;--wood3:#c58a3f;--hud:118px;--c:80px;
    /* the one wood (Rung's): a warm base, plank seams, faint grain, a top highlight */
    --woodbg:linear-gradient(180deg,rgba(255,240,210,.22),rgba(255,255,255,0) 38%,rgba(0,0,0,.10)),
      repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 46px,rgba(60,30,10,.28) 46px 48px),
      repeating-linear-gradient(0deg,rgba(255,225,180,.07) 0 2px,rgba(0,0,0,0) 2px 7px),
      linear-gradient(180deg,#b97b3a,#a9702f);
    /* the board: darker timber, long grain, no plank seams */
    --boardbg:linear-gradient(180deg,rgba(255,235,200,.16),rgba(255,255,255,0) 30%,rgba(0,0,0,.16)),
      repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 5px,rgba(70,35,12,.10) 5px 7px,rgba(0,0,0,0) 7px 19px),
      repeating-linear-gradient(0deg,rgba(255,225,180,.05) 0 2px,rgba(0,0,0,0) 2px 11px),
      linear-gradient(180deg,#9b6432,#7c4a21)}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%}
  body{height:100dvh;overflow:hidden auto;font:17px/1.4 var(--font-display);color:var(--ink);background:#c9a577;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
  /* a cloth on a table: warm sand, a faint weave, light from the top-left, darker at the edges */
  #stage{position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(ellipse 70% 60% at 40% 30%,rgba(255,245,220,.45),rgba(255,255,255,0) 100%),
      repeating-linear-gradient(45deg,rgba(120,80,40,.05) 0 2px,rgba(0,0,0,0) 2px 6px),
      repeating-linear-gradient(-45deg,rgba(120,80,40,.05) 0 2px,rgba(0,0,0,0) 2px 6px),
      linear-gradient(180deg,#e2c79b 0%,#cfae7e 60%,#b8925f 100%)}
  #scene{position:absolute;left:0;right:0;top:0;bottom:var(--hud)}
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 80% 75% at 50% 45%,rgba(0,0,0,0) 60%,rgba(60,35,15,.28) 100%)}

  /* --- the board ------------------------------------------------------------------------------ */
  #board{position:absolute;left:0;top:0;border-radius:calc(var(--c) * .30);background:var(--boardbg);border:3px solid #5a3414;
    transform:perspective(1600px) rotateX(9deg);transform-origin:50% 60%;
    box-shadow:0 calc(var(--c) * .12) 0 #4a2a12,0 calc(var(--c) * .34) calc(var(--c) * .40) rgba(40,22,8,.45),inset 0 0 0 2px rgba(255,235,200,.14),inset 0 calc(var(--c) * -.06) calc(var(--c) * .10) rgba(0,0,0,.22)}
  #board *{pointer-events:none}                          /* nothing decorative eats a tap; only pits are targets */
  #board .pit{pointer-events:auto;cursor:pointer}
  .pit{position:absolute;width:var(--c);height:var(--c)}
  .hole,.store{position:absolute;border-radius:50%;
    background:radial-gradient(circle at 50% 42%,#24130a 0,#35200f 42%,#5f3a1b 78%,#8a5a2c 100%);
    box-shadow:inset 0 calc(var(--c) * .07) calc(var(--c) * .12) rgba(0,0,0,.72),inset 0 calc(var(--c) * -.02) calc(var(--c) * .03) rgba(255,220,170,.16),0 1px 0 rgba(255,225,180,.22)}
  .hole{inset:10%;transition:transform .22s ease,box-shadow .22s ease}
  .pit.can .hole{box-shadow:inset 0 calc(var(--c) * .07) calc(var(--c) * .12) rgba(0,0,0,.72),inset 0 calc(var(--c) * -.02) calc(var(--c) * .03) rgba(255,220,170,.16),0 0 0 3px rgba(255,214,120,.55),0 0 18px rgba(255,200,90,.45)}
  .pit.up .hole{transform:translateY(-9%) scale(1.06);
    box-shadow:inset 0 calc(var(--c) * .07) calc(var(--c) * .12) rgba(0,0,0,.72),0 0 0 4px rgba(255,214,120,.8),0 calc(var(--c) * .10) calc(var(--c) * .14) rgba(0,0,0,.45),0 0 26px rgba(255,200,90,.85)}
  .pit.flash .hole{animation:flash .55s ease-out both}
  .store{border-radius:calc(var(--c) * .45)}
  .seed{position:absolute;left:50%;top:50%;width:calc(var(--c) * .19);height:calc(var(--c) * .13);margin:calc(var(--c) * -.065) 0 0 calc(var(--c) * -.095);border-radius:50%;
    background:radial-gradient(ellipse at 40% 32%,#a86f3d 0,#6d3f1f 38%,#3b1f0d 74%,#24120a 100%);box-shadow:0 1px 2px rgba(0,0,0,.65),inset 0 -1px 1px rgba(255,210,160,.12)}
  .seed::after{content:"";position:absolute;left:24%;top:16%;width:28%;height:26%;border-radius:50%;background:rgba(255,236,205,.5)}
  #fly{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
  #fly .seed{position:absolute;left:0;top:0;margin:0}
  .fly{position:absolute;left:0;top:0;width:0;height:0;transition:transform var(--dur,250ms) ease-in-out}
  .fly .seed{animation:hop var(--dur,250ms) ease-out both}
  #marker{position:absolute;left:0;top:0;width:calc(var(--c) * .36);height:calc(var(--c) * .36);margin:calc(var(--c) * -.18);border-radius:50%;z-index:6;
    background:radial-gradient(circle at 35% 30%,var(--wood3),var(--wood) 55%,var(--wood2));border:2px solid var(--wood2);
    box-shadow:0 3px 6px rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,235,200,.25);transition:opacity .45s ease}
  #marker.drop{animation:drop .5s cubic-bezier(.2,1.5,.4,1) both}
  #marker.hit{animation:turn .8s ease-in-out both}
  #marker.gone{opacity:0}
  /* the code tag beside the other side's row while it sows */
  #ctag{position:absolute;z-index:7;padding:4px 12px;border-radius:8px;background:var(--woodbg);border:2px solid var(--wood2);color:var(--cream);
    font-size:14px;font-weight:600;letter-spacing:.06em;text-shadow:0 1px 0 rgba(0,0,0,.4);box-shadow:0 4px 8px rgba(0,0,0,.35);transform:rotate(-3deg);animation:fade .2s both}
  @keyframes hop{0%{translate:0 0}50%{translate:0 calc(var(--c) * -.28)}100%{translate:0 0}}
  @keyframes drop{0%{opacity:0;translate:0 calc(var(--c) * -.8);scale:1.4}60%{opacity:1}100%{translate:0 0;scale:1}}
  @keyframes turn{0%{transform:rotateY(0)}50%{transform:rotateY(90deg);background:var(--wood2)}51%{background:radial-gradient(circle at 35% 30%,#fff1c8,#e2b45c 55%,#a9702f)}100%{transform:rotateY(180deg);background:radial-gradient(circle at 35% 30%,#fff1c8,#e2b45c 55%,#a9702f)}}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(255,214,120,.9),0 0 0 rgba(255,200,90,0)}40%{box-shadow:0 0 0 8px rgba(255,214,120,.9),0 0 40px rgba(255,200,90,1)}100%{box-shadow:0 0 0 0 rgba(255,214,120,0),0 0 0 rgba(255,200,90,0)}}

  /* --- sign board ------------------------------------------------------------------------------ */
  #sign{position:absolute;left:16px;top:14px;max-width:min(440px,calc(100% - 32px));padding:10px 22px 13px;border-radius:10px;z-index:3;
    background:var(--woodbg);border:3px solid var(--wood2);color:var(--cream);text-shadow:0 1px 0 rgba(0,0,0,.4);
    box-shadow:0 8px 16px rgba(20,30,20,.35),inset 0 0 0 2px rgba(255,235,200,.16);transform:rotate(-1.5deg);transform-origin:left top;pointer-events:none}
  #sign::before,#sign::after{content:"";position:absolute;top:7px;width:8px;height:8px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#efe0c4,#5a3a1c 70%)}
  #sign::before{left:8px}#sign::after{right:8px}
  .brand{display:block;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
  #task{display:block;font-size:24px;font-weight:700;line-height:1.15}

  /* --- the hand tray and the buttons ----------------------------------------------------------- */
  #hud{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 14px;
    padding:0 16px calc(16px + env(safe-area-inset-bottom));pointer-events:none}
  #hud>*{pointer-events:auto}
  button{font:inherit;cursor:pointer}
  .tray{position:relative;z-index:0;flex:1 1 260px;max-width:520px;min-height:84px;display:flex;align-items:center;gap:14px;padding:8px 16px 8px 18px;
    border-radius:14px 14px 10px 10px;background:var(--woodbg);border:3px solid var(--wood2);color:var(--cream);
    box-shadow:0 6px 0 var(--wood2),0 12px 18px rgba(20,30,20,.35),inset 0 0 0 2px rgba(255,235,200,.14)}
  .tray::before,.tray::after{content:"";position:absolute;bottom:-14px;width:24px;height:24px;border-radius:50%;z-index:-1;
    background:radial-gradient(circle,#3f2712 26%,#8a5a2c 30%,#8a5a2c 64%,#3f2712 68%)}
  .tray::before{left:22px}.tray::after{right:22px}
  .lbl{font-size:16px;font-weight:600;line-height:1.2;min-width:110px;max-width:190px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
  #bed{position:relative;flex:1;height:60px;min-width:160px;border-radius:8px;background:rgba(45,22,6,.5);box-shadow:inset 0 3px 8px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,225,180,.15);--c:70px}
  #bed .seed{position:absolute;left:0;top:0;margin:0}
  .btn{min-height:56px;min-width:56px;padding:0 28px;border-radius:16px;font-family:var(--font-display);font-weight:600;font-size:20px;
    background:var(--woodbg);color:var(--cream);border:3px solid var(--wood2);text-shadow:0 1px 0 rgba(0,0,0,.4);
    box-shadow:0 6px 0 var(--wood2),0 10px 14px rgba(20,30,20,.35),inset 0 0 0 2px rgba(255,235,200,.16)}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--wood2),0 4px 8px rgba(20,30,20,.3)}
  .btn.quiet{background:var(--paper);color:var(--wood2);text-shadow:none;border-color:#b58d5c;box-shadow:0 5px 0 #b58d5c,0 8px 12px rgba(20,30,20,.25);font-size:17px}
  .btn.quiet:active{box-shadow:0 1px 0 #b58d5c}
  #sound{flex:0 0 auto;padding:0 18px;min-width:120px}
  .links{display:flex;flex-wrap:wrap;gap:0 10px;margin-left:auto;justify-content:flex-end}
  .links a{font-size:14px;font-weight:600;color:var(--cream);text-shadow:0 1px 2px rgba(0,0,0,.6);text-decoration:none;white-space:nowrap;padding:14px 6px;min-height:44px}
  .links a:hover{text-decoration:underline}

  /* --- the hint card beside the marker, pips on the path -------------------------------------- */
  #bubble{pointer-events:none;position:absolute;z-index:8;background:var(--paper);border:2px solid var(--wood);border-radius:14px;padding:12px 16px;
    font-size:18px;font-weight:500;line-height:1.35;color:var(--ink);box-shadow:0 8px 18px rgba(20,30,20,.35);animation:fade .25s both}
  #bubble::after{content:"";position:absolute;width:16px;height:16px;background:var(--paper);transform:rotate(45deg);border:0 solid var(--wood)}
  #bubble[data-side=bottom]::after{left:var(--tx,50%);bottom:-10px;margin-left:-8px;border-width:0 2px 2px 0}
  #bubble[data-side=top]::after{left:var(--tx,50%);top:-10px;margin-left:-8px;border-width:2px 0 0 2px}
  #bubble[data-side=left]::after{top:var(--ty,50%);left:-10px;margin-top:-8px;border-width:0 0 2px 2px}
  #bubble[data-side=right]::after{top:var(--ty,50%);right:-10px;margin-top:-8px;border-width:2px 2px 0 0}
  #bsrc{display:block;margin-top:6px;font:11px/1 ui-monospace,monospace;font-weight:400;color:var(--muted)}
  #bsrc:empty,body.judge #bsrc{display:none}
  .pip{position:absolute;z-index:7;pointer-events:none;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--wood3),var(--wood) 55%,var(--wood2));border:2px solid var(--wood2);
    box-shadow:0 3px 6px rgba(0,0,0,.35);animation:pip 2s both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pip{0%{opacity:0;scale:.5}15%{opacity:1;scale:1}80%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){#bubble,#ctag{animation-duration:.01s}.pip{animation:none}.fly{transition:none}.fly .seed{animation:none}#marker.drop,#marker.hit{animation-duration:.01s}}

  @media (max-width:640px){
    #sign{left:12px;top:10px;padding:5px 12px 7px}
    .brand{font-size:11px}
    #task{font-size:16px}
    .tray{flex-basis:100%;min-height:72px;gap:10px}
    .lbl{font-size:13px;line-height:1.15;min-width:96px;max-width:150px}
    #bed{height:44px;min-width:100px;--c:56px}
    .btn{flex:1 1 auto;padding:0 18px}
    #sound{min-width:0;padding:0 14px;font-size:15px}
    .links{flex-direction:column;align-items:flex-end;gap:0}       /* Sound and the two links share one row; the pits get the height back */
    .links a{padding:5px 2px;min-height:28px;line-height:18px}
    #bubble{font-size:16px;padding:10px 12px}
  }
  @media (max-width:360px){#hud{gap:8px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}.tray{min-height:64px}.btn{min-height:48px}.links a{font-size:12px;padding:3px 2px;min-height:24px}}
  .pit.ring{outline:5px solid #ffd34d;outline-offset:4px;animation:ringpulse .9s ease-in-out infinite;z-index:5}
  @keyframes ringpulse{50%{outline-offset:9px;outline-color:#fff0b3}}
  @media (prefers-reduced-motion:reduce){.pit.ring{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="scene">
    <div id="board"></div>
  </div>
  <div id="vig"></div>
  <div id="fly"></div>
  <div id="bubble" role="status" aria-live="polite" data-side="bottom" hidden><span id="btext"></span><span id="bsrc"></span></div>
  <div id="sign"><span class="brand">Pip · Seeds</span><span id="task"></span><span id="strip"></span></div>
  <div id="hud">
    <div id="hand" class="tray"><span class="lbl" id="handl"></span><div id="bed"></div></div>
    <button class="btn" id="nextb" hidden>Next board</button>
    <button class="btn" id="restart" hidden>Start again</button>
    <button class="btn quiet" id="sound">Sound on</button>
    <button class="btn quiet" id="howtob">How to play</button>
    <nav class="links"><a id="grown" href="public/parent.html">For grown-ups</a><a id="srcl" href="public/source.html">Where this game comes from</a><a id="home" href="../">Home</a></nav>
  </div>
</div>
<script type="module" src="public/board.mjs"></script>
</body>
</html>
