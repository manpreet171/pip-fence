<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pip · Fence</title>
<link rel="icon" href="data:,">
<style>
  @font-face{font-family:"Fredoka";src:url(/assets/fonts/Fredoka.ttf) format("truetype");font-weight:300 700;font-display:swap}
  :root{--font-display:"Fredoka","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    --ink:#22303a;--muted:#5d5246;--paper:#efe3cd;--cream:#f8f1e3;--wood:#a9702f;--wood2:#7d5122;--wood3:#c58a3f;--hud:118px;
    /* the one wood: a warm base, plank seams, faint grain, a top highlight */
    --woodbg:linear-gradient(180deg,rgba(255,240,210,.22),rgba(255,255,255,0) 38%,rgba(0,0,0,.10)),
      repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 46px,rgba(60,30,10,.28) 46px 48px),
      repeating-linear-gradient(0deg,rgba(255,225,180,.07) 0 2px,rgba(0,0,0,0) 2px 7px),
      linear-gradient(180deg,#b97b3a,#a9702f)}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;overflow:hidden}
  body{height:100dvh;font:17px/1.4 var(--font-display);color:var(--ink);background:#8fd0f0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
  #stage{position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(ellipse 22% 9% at 18% 9%,rgba(255,255,255,.55),rgba(255,255,255,0) 100%),
      radial-gradient(ellipse 16% 7% at 62% 6%,rgba(255,255,255,.5),rgba(255,255,255,0) 100%),
      radial-gradient(ellipse 26% 8% at 86% 13%,rgba(255,255,255,.45),rgba(255,255,255,0) 100%),
      linear-gradient(180deg,#8fd0f0 0%,#b3e0f4 8%,#dff0d8 15%,#dff0d8 100%)}
  #scene{position:absolute;left:0;right:0;top:0;bottom:var(--hud)}
  /* vignette + the ground a shade darker toward the bottom edge; morning light from the top-left */
  #vig{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(30,50,20,.28) 100%),
      radial-gradient(ellipse 75% 70% at 50% 45%,rgba(0,0,0,0) 60%,rgba(20,35,20,.30) 100%)}

  /* --- sign board -------------------------------------------------------------------------- */
  #sign{position:absolute;left:16px;top:14px;max-width:min(440px,calc(100% - 32px));padding:10px 22px 13px;border-radius:10px;
    background:var(--woodbg);border:3px solid var(--wood2);color:var(--cream);text-shadow:0 1px 0 rgba(0,0,0,.4);
    box-shadow:0 8px 16px rgba(20,30,20,.35),inset 0 0 0 2px rgba(255,235,200,.16);transform:rotate(-1.5deg);transform-origin:left top}
  #sign::before,#sign::after{content:"";position:absolute;top:7px;width:8px;height:8px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#efe0c4,#5a3a1c 70%)}
  #sign::before{left:8px}#sign::after{right:8px}
  .brand{display:block;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
  #task{display:block;font-size:24px;font-weight:700;line-height:1.15}

  /* --- the cart tray and the buttons ------------------------------------------------------- */
  #hud{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 14px;
    padding:0 16px calc(16px + env(safe-area-inset-bottom));pointer-events:none}
  #hud>*{pointer-events:auto}
  button{font:inherit;cursor:pointer}
  .tray{position:relative;z-index:0;flex:1 1 260px;max-width:470px;min-height:84px;display:flex;align-items:center;gap:14px;padding:8px 16px 8px 18px;
    border-radius:14px 14px 10px 10px;background:var(--woodbg);border:3px solid var(--wood2);color:var(--cream);
    box-shadow:0 6px 0 var(--wood2),0 12px 18px rgba(20,30,20,.35),inset 0 0 0 2px rgba(255,235,200,.14)}
  .tray::before,.tray::after{content:"";position:absolute;bottom:-14px;width:24px;height:24px;border-radius:50%;z-index:-1;
    background:radial-gradient(circle,#3f2712 26%,#8a5a2c 30%,#8a5a2c 64%,#3f2712 68%)}
  .tray::before{left:22px}.tray::after{right:22px}
  #cart{cursor:pointer}
  #cart.held{box-shadow:0 6px 0 var(--wood2),0 0 0 4px rgba(255,214,120,.75),0 0 28px rgba(255,200,90,.85)}
  .lbl{font-size:15px;font-weight:600;line-height:1.2;min-width:64px;max-width:110px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
  #pile{position:relative;flex:1;height:64px;min-width:240px;border-radius:8px;background:rgba(45,22,6,.5);box-shadow:inset 0 3px 8px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,225,180,.15)}
  .plank{width:58px;display:block;filter:brightness(1.18) saturate(1.05) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
  .pack{position:relative;display:inline-block;width:36px;height:34px;cursor:pointer}
  .pack img{position:absolute;left:0;width:34px;filter:brightness(1.18) saturate(1.05) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
  /* the delivery slip: a paper note pinned on the tray */
  #note{flex:1;display:flex;align-items:center;gap:8px;min-height:56px;padding:4px 10px;border-radius:3px;background:var(--cream);color:var(--ink);
    box-shadow:0 2px 5px rgba(0,0,0,.35);transform:rotate(-1deg)}
  #note::before{content:"";position:absolute;left:50%;top:-6px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0d9a8,#8a5a2c 70%);transform:translateX(-50%)}
  #addpack{width:48px;height:48px;flex:none;border:2px dashed var(--wood);border-radius:10px;background:rgba(169,112,47,.08);display:grid;place-items:center;padding:0}
  #addpack .pack{opacity:.45;cursor:inherit}
  /* two rows of small packs, never a taller tray. ponytail: a third row (17+ packs on 4x5 at 320) is clipped */
  #slipn{display:flex;flex-wrap:wrap;gap:1px 2px;align-content:flex-start;flex:1;min-height:36px;max-height:44px;overflow:hidden}
  #slipn .pack{zoom:.6}
  .btn{min-height:56px;min-width:56px;padding:0 28px;border-radius:16px;font-family:var(--font-display);font-weight:600;font-size:20px;
    background:var(--woodbg);color:var(--cream);border:3px solid var(--wood2);text-shadow:0 1px 0 rgba(0,0,0,.4);
    box-shadow:0 6px 0 var(--wood2),0 10px 14px rgba(20,30,20,.35),inset 0 0 0 2px rgba(255,235,200,.16)}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--wood2),0 4px 8px rgba(20,30,20,.3)}
  .btn.quiet{background:var(--paper);color:var(--wood2);text-shadow:none;border-color:#b58d5c;box-shadow:0 5px 0 #b58d5c,0 8px 12px rgba(20,30,20,.25);font-size:17px}
  .btn.quiet:active{box-shadow:0 1px 0 #b58d5c}
  #sound{flex:0 0 auto;padding:0 18px;min-width:120px}
  #grown{font-size:14px;font-weight:600;color:var(--cream);text-shadow:0 1px 2px rgba(0,0,0,.6);text-decoration:none;white-space:nowrap;
    padding:14px 8px;min-height:44px;margin-left:auto}
  #grown:hover{text-decoration:underline}

  /* --- bubble on the gap, pips on the rails ------------------------------------------------- */
  #bubble{pointer-events:none;position:absolute;z-index:6;background:var(--cream);border:3px solid var(--wood2);border-radius:18px;padding:12px 16px 12px 14px;
    font-size:18px;font-weight:500;line-height:1.35;color:var(--ink);box-shadow:0 5px 0 var(--wood2),0 12px 22px rgba(20,30,20,.35);animation:fade .25s both;
    display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:start}
  #bubble .pipface{grid-row:1/span 3;margin-top:2px}
  #bubble #btext{grid-column:2}
  #bubble #bsrc,#bubble .pipagain{grid-column:2}
  /* the tail sits on whichever edge faces the gap: --tx along the top/bottom edge, --ty along a side */
  #bubble::after{content:"";position:absolute;width:16px;height:16px;background:var(--cream);transform:rotate(45deg);border:0 solid var(--wood2)}
  #bubble[data-side=bottom]::after{left:var(--tx,50%);bottom:-10px;margin-left:-8px;border-width:0 3px 3px 0}
  #bubble[data-side=top]::after{left:var(--tx,50%);top:-10px;margin-left:-8px;border-width:3px 0 0 3px}
  #bubble[data-side=left]::after{top:var(--ty,50%);left:-10px;margin-top:-8px;border-width:0 0 3px 3px}
  #bubble[data-side=right]::after{top:var(--ty,50%);right:-10px;margin-top:-8px;border-width:3px 3px 0 0}
  #bsrc{display:block;margin-top:6px;font:11px/1 ui-monospace,monospace;font-weight:400;color:var(--muted)}
  #bsrc:empty,body.judge #bsrc{display:none}
  body.judge #scene{top:88px}   /* with the panel open the stage is narrow: seat the world under the sign */
  .pip{position:absolute;z-index:7;pointer-events:none;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--wood3),var(--wood) 55%,var(--wood2));border:2px solid var(--wood2);color:var(--cream);
    font-weight:700;font-size:13px;display:grid;place-items:center;box-shadow:0 3px 6px rgba(0,0,0,.35);animation:pip 2s both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pip{0%{opacity:0;scale:.5}15%{opacity:1;scale:1}80%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){#bubble{animation-duration:.01s}.pip{animation:none}}

  @media (max-width:640px){
    :root{--hud:188px}
    #sign{left:12px;top:10px;padding:8px 16px 10px}
    #task{font-size:18px}
    .tray{flex-basis:100%;min-height:78px}
    #slip .lbl{display:none}
    #pile{height:56px;min-width:120px}
    .btn{flex:1 1 auto;padding:0 18px}
    #sound{min-width:0;padding:0 14px;font-size:15px}
    #grown{padding:14px 4px}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="scene" class="scene"></div>
  <div id="vig"></div>
  <div id="bubble" role="status" aria-live="polite" data-side="bottom" hidden><span id="btext"></span><span id="bsrc"></span></div>
  <div id="sign"><span class="brand">Pip · Fence</span><span id="task"></span><span id="strip"></span></div>
  <div id="hud">
    <div id="cart" class="tray"><span class="lbl" id="cartl">Cart</span><div id="pile"></div></div>
    <div id="slip" class="tray" hidden><span class="lbl">I need</span><div id="note"><button id="addpack" title="add a pack"></button><div id="slipn"></div></div></div>
    <button class="btn" id="deliver" hidden>Bring it</button>
    <button class="btn" id="addpart" hidden>+ part</button>
    <button class="btn" id="delpart" hidden>&minus; part</button>
    <button class="btn" id="build" hidden>Build</button>
    <button class="btn quiet" id="again" hidden>Order again</button>
    <button class="btn" id="done">Done</button>
    <button class="btn" id="restart" hidden>Start again</button>
    <button class="btn quiet" id="sound">Sound on</button>
    <button class="btn quiet" id="howtob">How to play</button>
    <a id="grown" href="/public/parent.html">For grown-ups</a>
    <a id="home" href="/" style="font-size:14px;font-weight:600;color:#f8f1e3;text-shadow:0 1px 2px rgba(0,0,0,.6);text-decoration:none;padding:14px 8px;min-height:44px">Home</a>
  </div>
</div>
<script type="module">
  import { GRAPH, IDS, shape, next, unlocked, candidates, validShow, codeShow, classify, level, mountScene, appendPlank, removePlank, onTap, bubbleSpot, railPoint, goatWalk, FENCE_CSS } from "/fence.mjs";
  import * as buddy from "/buddy.mjs";
  import * as pip from "/public/pip.mjs";
  const { TEMPLATES, hint, payload } = buddy;
  document.head.insertAdjacentHTML("beforeend", `<style>${FENCE_CSS}</style>`);

  const $ = id => document.getElementById(id), px = n => n.toFixed(1) + "px";
  const Q = new URLSearchParams(location.search), DEBUG = Q.has("debug");
  const IDLE_MS = 45000, KEY = "rung.v1", BOARD = "/assets/fence/board.png";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ v: 1, mastery: S.mastery, build: { node: S.node, parts: S.parts, cart: S.cart, n: S.n }, events: S.events, ended: S.ended })); } catch {} };

  // One plain object. The event log is the state history; `events` is a ring across levels and
  // lvl() is the slice classify() reads. `n` is the parts she has framed in share, before Build.
  const S = { mastery: {}, node: null, parts: [], cart: 0, n: 0, held: null, events: [], at: 0, slip: 0, pre: null, probe: false, done: false, ended: false, retry: false, idle: 0, tok: 0, last: null };
  const scene = $("scene");
  let J = null;                                        // the judge's overlay, mounted only when asked for
  const sh = () => shape(S.node);
  const lvl = () => level(S.events);
  // The wood is on the plot: always in concrete; after the one delivery in packs and fix; after Build in share.
  const delivered = () => { const m = sh().mode; return m === "concrete" || lvl().some(e => e.e === (m === "share" ? "parts" : "order")); };
  const stripNow = () => pip.strip($("strip"), GRAPH.filter(g => g.chapter === sh().chapter).map(g => g.node), S.mastery, S.node);

  function log(e) {
    S.events.push({ t: Date.now() - S.at, ...e }); save(); J?.update();
    if (e.e !== "commit" && e.e !== "hint") arm();
  }
  // hint() with its round trip measured, for the judge's overlay only; hint() itself is untouched.
  const timed = r => { const t0 = performance.now(); return hint(r).then(h => ({ ...h, ms: Math.round(performance.now() - t0) })); };
  function arm() { clearTimeout(S.idle); S.idle = setTimeout(() => { if (!S.done) { log({ e: "commit", reason: "idle" }); onCommit(); } }, IDLE_MS); }

  function start(node) {
    if (node !== S.node) S.retry = false;
    const s = shape(node);
    // Fix starts from the pre-built planks with an empty cart; share from a bare plot with the whole load.
    Object.assign(S, { node, parts: s.pre ? [...s.pre] : Array(s.mode === "share" ? 0 : s.groups).fill(0), cart: s.mode === "packs" || s.mode === "fix" ? 0 : s.groups * s.per,
      n: 0, held: null, slip: 0, pre: null, probe: false, done: false, ended: false, at: Date.now() });
    S.events = S.events.slice(-500);
    log({ e: "level_start", node, at: S.at });
    mount();
    howFor(s.mode); maybeDemo();
  }
  function mount() {
    const s = sh();
    mountScene(scene, s.mode === "share" ? { ...s, groups: S.n } : s);
    S.parts.forEach((n, p) => { for (let i = 0; i < n; i++) appendPlank(scene, p, i); });
    $("task").textContent = s.mode === "share" ? `${s.groups * s.per} planks · ${s.per} in each part · how many parts?`
      : `${s.groups} parts · ${s.per} planks in each part` + ({ packs: ` · packs of ${s.pack}`, fix: " · fill the gaps" }[s.mode] || "");
    stripNow();
    hideBubble(); render();
  }

  // The cart holds a heap, not a row: Kenney's plank slab (assets/fence/board.png) in three rows of
  // overlapping boards, each row leaning a little the other way from the one under it, so twelve planks
  // read as a pile of lumber. Never a digit.
  const plank = () => `<img class="plank" src="${BOARD}" alt="">`;
  const pack = n => `<span class="pack">${Array.from({ length: n }, (_, i) => `<img src="${BOARD}" alt="" style="top:${(n - 1 - i) * 4}px">`).join("")}</span>`;
  const heap = (n, item, step) => { const W = $("pile").clientWidth, per = Math.ceil(n / 3); step = Math.min(step, (W - 60) / per | 0);
    const x0 = Math.max(8, (W - 50 - per * step) / 2);
    return Array.from({ length: n }, (_, k) => { const row = Math.floor(k / per), col = k % per;
      return `<span style="position:absolute;left:${x0 + col * step + row * (step / 2)}px;bottom:${2 + row * 9}px;transform:rotate(${row % 2 ? 3 : -3}deg)">${item}</span>`; }).join(""); };
  function render() {
    document.body.classList.toggle("probe", !!S.probe);
    const s = sh(), d = delivered(), packs = s.mode === "packs", share = s.mode === "share";
    $("cart").hidden = !d; $("slip").hidden = d || share; $("deliver").hidden = d || share; $("done").hidden = !d;
    $("addpart").hidden = d || !share; $("delpart").hidden = d || !share || !S.n; $("build").hidden = d || !share || !S.n;
    $("again").hidden = !(s.mode !== "concrete" && d && lvl().some(e => e.e === "hint") && !S.done);
    $("again").textContent = "Try again";
    if (d) {
      $("pile").innerHTML = heap(S.cart, packs ? pack(s.pack) : plank(), packs ? 34 : 34);
      $("cart").classList.toggle("held", !!S.held);
      $("cartl").textContent = !S.cart ? "Cart is empty" : S.held ? "Got it. Tap a part." : "Cart";
    } else if (!share) {                               // the order slip: pack silhouettes in packs, single planks in fix
      $("addpack").innerHTML = pack(packs ? s.pack : 1);
      $("slipn").innerHTML = Array.from({ length: S.slip }, () => pack(packs ? s.pack : 1)).join("");
    }
    $("done").textContent = S.done ? "Next fence" : "Done";
  }

  // --- input -----------------------------------------------------------------------------------
  $("cart").onclick = () => {
    if (S.done || !S.cart || S.held) return;          // already holding: no-op, the hand stays held (D-065)
    S.held = sh().mode === "packs" ? "pack" : "plank";
    log({ e: "plank_held", held: S.held });
    render();
  };
  $("addpack").onclick = () => { const s = sh(); if (S.slip < s.groups * s.per) { S.slip++; render(); } };
  $("slipn").onclick = e => { if (e.target.closest(".pack")) { S.slip--; render(); } };
  $("deliver").onclick = () => { if (!S.slip) return; S.cart = S.slip; log({ e: "order", ...(sh().mode === "fix" ? { planks: S.slip } : { packs: S.slip }) }); render(); };
  // Share: frame the parts one at a time (the scene re-mounts around them), then Build locks the frame.
  $("addpart").onclick = () => { const s = sh(); if (S.n < Math.min(8, s.groups * s.per)) { S.n++; mount(); } };
  $("delpart").onclick = () => { if (S.n) { S.n--; mount(); } };
  $("build").onclick = () => { if (!S.n) return; S.parts = Array(S.n).fill(0); log({ e: "parts", n: S.n }); render(); };
  // Same level, so earlier hints still count and the tier escalates; level() drops the old order and rails.
  $("again").onclick = () => { const s = sh(); S.retry = true;
    Object.assign(S, { parts: s.pre ? [...s.pre] : s.mode === "share" ? [] : S.parts.fill(0), cart: s.mode === "share" ? s.groups * s.per : 0, held: null, slip: 0, pre: null, probe: false });
    log({ e: "order_reset" }); mount(); };
  $("restart").onclick = () => { S.mastery = {}; save(); $("restart").hidden = true; start("3x4_concrete"); };
  $("done").onclick = () => {
    if (S.done) return advance();
    if (!delivered()) return;
    log({ e: "commit", reason: "left_plot" }); onCommit();
  };
  onTap(scene, (part, i, e) => {
    if (S.done || !delivered()) return;
    if (part === null) {
      if (!S.held) return log({ e: "tap_idle" });
      // nearest part by distance to the hit-region centres — cheap, and only for the record
      const near = [...scene.querySelectorAll(".hit")].map(h => { const r = h.getBoundingClientRect();
        return [Math.hypot(r.left + r.width / 2 - e.clientX, r.top + r.height / 2 - e.clientY), +h.dataset.part]; }).sort((a, b) => a[0] - b[0])[0];
      return log({ e: "place_failed", nearest_group: near[1], held: S.held });
    }
    if (S.held) return place(part);          // a held plank always places, even on an existing rail
    // Empty hand: a tap counts the part. A plank leaves only when it is the one sticking out over the
    // post, or when she taps the same part again while the pips are still up (D-066).
    const overRail = i !== null && e.target.classList.contains("over");
    if (overRail || S.counting === part) return remove(part);
    count(part);
  });

  function place(part) {
    const s = sh(), unit = S.held, n = unit === "pack" ? s.pack : 1, from = S.parts[part];
    for (let k = 0; k < n; k++) appendPlank(scene, part, from + k);
    S.parts[part] += n; S.cart--; if (!S.cart) S.held = null;
    if (!S.showing) hideBubble(); S.probe = false;
    log({ e: "place", unit, ...(n > 1 && { n }), group: part, n_in_group: S.parts[part] });
    const r = classify(lvl());
    if (r.id === "correct") { log({ e: "commit", reason: "left_plot" }); return finish(r); }
    // Prefetch: the build is complete-and-wrong (cart empty) or a part overflows. Held until commit.
    if (!S.cart || S.parts[part] > s.per) {
      const p = classify([...lvl(), { t: Date.now() - S.at, e: "commit", reason: "left_plot" }]);
      if (IDS.includes(p.id) && p.id !== "ambiguous" && S.pre?.key !== p.id + p.tier) S.pre = { key: p.id + p.tier, h: timed(p) };
    }
    render();
  }
  function remove(part) {
    const s = sh(), n = s.mode === "packs" ? s.pack : 1;
    if (S.parts[part] < n) return;
    for (let k = 1; k <= n; k++) removePlank(scene, part, S.parts[part] - k);   // the top rail(s) go back
    S.parts[part] -= n; S.cart++;
    S.pre = null; if (!S.showing) hideBubble(); S.probe = false; S.counting = null;
    log({ e: "remove", unit: n > 1 ? "pack" : "plank", ...(n > 1 && { n }), group: part, n_in_group: S.parts[part] });
    render();
  }
  // Tap-to-count: code walks the rails that are on screen with a pip. Never what should be there.
  function count(part) {
    log({ e: "tap_count", group: part });
    const n = S.parts[part], still = matchMedia("(prefers-reduced-motion:reduce)").matches;  // reduced motion: all pips at once, static, gone after 1.2 s
    S.counting = part; S.pips = Date.now() + (still ? 1200 : n * 450 + 2100);
    setTimeout(() => { if (S.counting === part) S.counting = null; }, still ? 1200 : n * 450 + 2100);
    for (let i = 0; i < n; i++) {
      const p = railPoint(scene, part, i), el = document.createElement("span");
      el.className = "pip"; el.textContent = i + 1;
      el.style.cssText = `left:${px(p.x)};top:${px(p.y)};animation-delay:${i * .45}s`;
      $("stage").appendChild(el); setTimeout(() => el.remove(), still ? 1200 : i * 450 + 2100);
    }
    if (S.probe) { S.probe = false; clearTimeout(S.probeT); const r = classify(lvl()); if (r.id !== "ambiguous" && IDS.includes(r.id)) setTimeout(() => showHint(r), n * 450 + 400); }
  }

  // --- commit → classify → hint on the gap ------------------------------------------------------
  function onCommit() {
    S.held = null;                                     // Done is where the hand opens; a full part can then be tap-counted
    const r = classify(lvl());
    if (r.id === "correct") return finish(r);
    goatToGap(r.counts);
    if (IDS.includes(r.id)) showHint(r);
    render();
  }
  function goatToGap(c) { const gap = c.findIndex(n => n < sh().per); if (gap >= 0 && c.some(n => n > 0)) goatWalk(scene, gap, true); }
  const gapAt = c => Math.max(0, c.findIndex(n => n !== sh().per));
  async function showHint(r) {
    log({ e: "hint", id: r.id, tier: r.tier });
    const at = gapAt(r.counts);
    if (r.id === "ambiguous") {
      S.probe = true; S.hint = { id: r.id, tier: 1, source: "template", reason: "probe", ms: 0 }; J?.update();
      // No tap within 20 s: the classifier's own rule says take the likelier branch, unconfirmed. A
      // commit event carries the time; the page does not decide which branch, classify() does.
      clearTimeout(S.probeT); S.probeT = setTimeout(() => { if (S.probe && !S.done) { S.probe = false; log({ e: "commit", reason: "probe_timeout" }); const p = classify(lvl()); if (IDS.includes(p.id) && p.id !== "ambiguous") showHint(p); render(); } }, 20500);
      render(); return bubble(TEMPLATES.ambiguous[1], "template", at);
    }
    const tok = ++S.tok, key = r.id + r.tier;
    S.hintR = r;
    const h = await (S.pre?.key === key ? S.pre.h : timed(r)); S.pre = null;
    S.hint = { id: r.id, tier: r.tier, payload: payload(r), ...h }; J?.update();
    if (tok === S.tok) bubble(h.text, h.source, at);
    render();
  }
  function finish(r) {
    S.done = true; S.last = r; clearTimeout(S.idle);
    const L = lvl(), s = sh(), node = S.node, hinted = S.retry || L.some(e => e.e === "hint");
    S.mastery[node] = hinted ? 0.5 : 1; save();
    stripNow();
    pip.star(!hinted, hinted ? "Fence done. A silver star." : "Fence done. A gold star!");
    goatWalk(scene, scene.geom.goat.part, false);
    // Pip cheers (docs/MODES.md): booleans only, nothing from the build. Not called when a hint with no
    // count-then-fix is the only fact; the card then says what it always said.
    const h = L.findLast(e => e.e === "hint"), mid = Math.floor(s.groups / 2);
    const sum = { first_try: !hinted && L.filter(e => e.e === "commit").length === 1, used_hint: !!h, fixed_after_count: !!h && L.some(e => e.e === "tap_count" && e.t > h.t) && !L.some(e => e.e === "show" && e.t > h.t),   // Pip's own count is not hers
      mode: s.mode === "concrete" ? "build" : s.mode, chapter_done: GRAPH.every(g => g.chapter !== s.chapter || S.mastery[g.node] > 0) };
    // The card waits for the star moment to pass, so the two never sit on top of each other.
    const after = fn => setTimeout(fn, matchMedia("(prefers-reduced-motion:reduce)").matches ? 0 : 2300);
    if (typeof buddy.cheer === "function" && (sum.first_try || sum.fixed_after_count || sum.chapter_done))
      buddy.cheer(sum).then(c => after(() => { if (S.done && S.node === node) bubble(c?.text || "The fence is done.", c?.source || "", mid); }), () => after(() => bubble("The fence is done.", "", mid)));
    else after(() => { if (S.done && S.node === node) bubble("The fence is done.", "", mid); });
    render();
  }
  // Pip plans the next fence (D-081). Code lists the fences that are open and exercise the last
  // mistake; the model picks one and says why; the pick is checked here against the same list, and
  // anything else falls back to next(). The ambiguous probe keeps its diagnostic route.
  const recent = () => {                               // the last eight levels as booleans and counts, oldest first
    const out = []; let cur = null;
    for (const e of S.events) {
      if (e.e === "level_start") { cur = { node: e.node, ids: [], hints: 0, first_try: false, fixed_after_count: false, commits: 0, lastHint: -1 }; out.push(cur); continue; }
      if (!cur) continue;
      if (e.e === "hint") { cur.hints++; if (!cur.ids.includes(e.id) && cur.ids.length < 4) cur.ids.push(e.id); cur.lastHint = e.t; }
      if (e.e === "commit") cur.commits++;
      if (e.e === "tap_count" && cur.lastHint >= 0 && e.t > cur.lastHint) cur.fixed_after_count = true;
    }
    return out.slice(-9, -1).map(({ commits, lastHint, ...h }) => ({ ...h, first_try: !h.hints && commits === 1 }));
  };
  async function advance() {
    const L = lvl();
    if (L.some(e => e.e === "hint" && e.id === "ambiguous")) { const n = next(S.mastery, { id: "ambiguous", node: S.node }); return n ? start(n) : end(); }
    const last = { id: L.findLast(e => e.e === "hint")?.id || "correct", node: S.node }, cands = candidates(S.mastery, last);
    if (!cands.length) return end();
    $("done").disabled = true; $("done").textContent = "Pip is picking";
    const p = typeof buddy.plan === "function" ? await buddy.plan({ mastery: S.mastery, history: recent(), last }) : null;
    $("done").disabled = false;
    const valid = cands.includes(p?.node), node = valid ? p.node : (next(S.mastery, last) ?? cands[0]);
    S.plan = { node, valid, source: valid ? p.source : "code", why: valid ? p.why : "", reason: p?.reason, choices: cands }; J?.update();
    start(node);
    if (valid && p.why && guided()) bubble(p.why, p.source, 0);   // never over Pip's own demo on a chapter's first level
  }
  // Every plot fenced. Mastery stays (the parent screen reads it) until she taps Start again.
  function end() {
    S.done = S.ended = true; save(); clearTimeout(S.idle); hideBubble();
    $("task").textContent = "Every fence is done!";
    for (const id of ["cart", "slip", "deliver", "done", "again"]) $(id).hidden = true;
    $("restart").hidden = false;
  }

  // --- bubble ----------------------------------------------------------------------------------
  // Pip lives on the card: the face, and a button that asks for the next tier through the same gate and judge.
  $("bubble").insertAdjacentHTML("afterbegin", pip.face());
  const againBtn = pip.again($("bsrc"), async () => {
    if (!S.hintR) return;
    const nr = { ...S.hintR, tier: Math.min(3, (S.hintR.tier || 1) + 1) };
    log({ e: "hint", id: nr.id, tier: nr.tier }); S.hintR = nr;
    const h = await timed(nr); S.hint = { id: nr.id, tier: nr.tier, payload: payload(nr), ...h }; J?.update();
    bubble(h.text, h.source, gapAt(nr.counts));
  });
  // "Show me, Pip" (D-082): after the second hint, on levels built plank by plank. The model writes
  // the moves from the real counts; validShow() simulates them here again before Pip performs them
  // on one part and hands the rest back. Every plank she places is logged as hers, so the record is honest.
  const showBtn = pip.showme($("bsrc"), async () => {
    const r = S.hintR; if (!r || S.showing) return;
    const s = sh(), b = { per: s.per, parts: [...S.parts], cart: S.cart, misconception_id: r.id, tier: r.tier };
    const out = typeof buddy.show === "function" ? await buddy.show(b) : { steps: [], source: "template" };
    const steps = validShow(out.steps, b) ? out.steps : codeShow(b), source = validShow(out.steps, b) ? out.source : "code";
    S.show = { steps, source, reason: out.reason }; J?.update();
    if (!steps.length) return;
    log({ e: "show", source, moves: steps.length });
    S.showing = true; showBtn.hidden = againBtn.hidden = true;
    const sl = ms => new Promise(res => setTimeout(res, matchMedia("(prefers-reduced-motion:reduce)").matches ? 0 : ms));
    try {
      for (const st of steps) {
        if (S.done) break;
        if (st.op === "say") { await bubble(st.text, source, S.bpart ?? 0); await sl(700); }
        else if (st.op === "point") { await bubble("Look at this part.", source, st.part); await sl(600); }
        else if (st.op === "count") { count(st.part); await sl(S.parts[st.part] * 450 + 900); }
        else if (st.op === "place" && S.cart && S.parts[st.part] < s.per) { S.held = "plank"; place(st.part); S.held = null; render(); await speakNow(COUNT[S.parts[st.part] - 1] || ""); await sl(350); }
        else if (st.op === "remove" && S.parts[st.part] > 0) { remove(st.part); await sl(900); }
      }
    } finally { S.showing = false; S.counting = null; }
  });
  function bubble(text, source, part) {
    againBtn.hidden = !S.hintR || S.done || S.probe || !!S.showing;
    showBtn.hidden = againBtn.hidden || (S.hintR?.tier || 1) < 2 || sh().mode === "packs" || (sh().mode === "share" && !S.parts.length);
    const b = $("bubble"); S.bpart = part;
    $("btext").textContent = text; $("bsrc").textContent = DEBUG ? source : "";
    b.hidden = false; placeBubble(); return speak(text);
  }
  // Spoken hints (D-071): the browser's own voice, nothing leaves the device. Says exactly the card's
  // text, once per card, never over the counting pips. One control, remembered on this device.
  const tts = globalThis.speechSynthesis, SOUND = "rung.sound";
  let sound = true; try { sound = localStorage.getItem(SOUND) !== "0"; } catch {}
  $("sound").hidden = false;
  const soundLabel = () => { $("sound").textContent = sound ? "Sound on" : "Sound off"; };
  soundLabel();
  $("sound").onclick = () => { sound = !sound; try { localStorage.setItem(SOUND, sound ? "1" : "0"); } catch {} soundLabel(); if (!sound) hush(); };
  // Pip's voice (D-084): every fixed line ships as a small audio file made from one child's voice
  // (generated once, bundled as files); the manifest maps text to file. A line with no file, which is always a
  // model-phrased one, is spoken by the browser's own voice, the friendliest one it has.
  let VOICE = await Promise.race([fetch("/assets/voice/manifest.json").then(r => r.ok ? r.json() : {}), new Promise(r => setTimeout(() => r({}), 1500))]).catch(() => ({}));
  let clip = null;
  const hush = () => { spoken++; tts?.cancel(); if (clip) { clip.pause(); clip = null; } };
  // The server's voice (D-086): if it has one, every line comes through it, so the model's lines and
  // the fixed lines sound the same. The bundled clips are the same voice (Ana) when the server uses
  // Ana; otherwise the server voices even the fixed lines, so there is still only one voice.
  let SERVER_VOICE = null; fetch("/api/say").then(r => r.ok ? r.json() : {}).then(j => { SERVER_VOICE = j?.voice || null; }).catch(() => {});
  const blobs = new Map();
  async function fromServer(text) {
    if (!SERVER_VOICE) return null;
    if (blobs.has(text)) return blobs.get(text);
    try { const r = await fetch("/api/say", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }), signal: AbortSignal.timeout(9000) });
      if (!r.ok) return null; const u = URL.createObjectURL(await r.blob()); blobs.set(text, u); return u; } catch { return null; }
  }
  // voices load late in some browsers; keep the list fresh and pick the friendliest natural one
  let VOICES = []; const loadVoices = () => { VOICES = (tts?.getVoices() || []).filter(v => /^en/i.test(v.lang)); }; loadVoices(); tts?.addEventListener?.("voiceschanged", loadVoices);
  const PREFER = /Ana|Maisie|Libby|Sonia|Aria|Jenny|Ava|Emma|Google UK English Female|Samantha|Zira/;
  // One speaker. Every call gets a token; hush() bumps it, so a line that was still being fetched
  // when a newer line started is dropped instead of playing late over it. Bundled clips are the same
  // voice as the server's (D-086), so fixed lines are instant and only fresh model lines wait.
  let spoken = 0;
  async function voiceNow(text, rate = 0.92) {           // -> resolves when the line has ended, or was dropped
    const mine = ++spoken;
    const play = src => new Promise(done => { if (mine !== spoken) return done(); clip = new Audio(src); clip.onended = clip.onerror = done; clip.play().catch(done); });
    if (VOICE[text]) return play("/assets/voice/" + VOICE[text]);
    const url = await fromServer(text); if (mine !== spoken) return; if (url) return play(url);
    return new Promise(done => {
      if (!tts) return done();
      if (!VOICES.length) loadVoices();
      const u = new SpeechSynthesisUtterance(text); u.rate = rate; u.pitch = 1.1; u.lang = "en"; u.onend = u.onerror = done;
      const v = VOICES.find(v => PREFER.test(v.name) && /Natural|Online/.test(v.name)) || VOICES.find(v => PREFER.test(v.name)) || VOICES[0]; if (v) u.voice = v;
      tts.speak(u);
    });
  }
  // The sheet is read aloud line by line, because the child it is for cannot read it yet.
  async function sayAll(lines) { for (const l of lines) { if (!sound || !document.getElementById("howto")) return; hush(); await voiceNow(l); await new Promise(r => setTimeout(r, 400)); } }
  function speak(text) {                                 // -> resolves when the line has been said
    if (!sound) return Promise.resolve();
    const wait = (S.pips || 0) - Date.now();
    if (wait > 0) return new Promise(r => setTimeout(() => { if (!$("bubble").hidden && $("btext").textContent === text) speak(text).then(r); else r(); }, wait));
    hush(); return voiceNow(text);
  }
  // Beside the gap, never on it (D-070): bubbleSpot keeps the card off every post, rail and the goat, and
  // off the sign; on a phone with no room beside, it goes in the band under the sign.
  function placeBubble() {
    const b = $("bubble"); if (b.hidden) return;
    const w = Math.min(280, scene.clientWidth - 16); b.style.cssText = `width:${px(w)}`;
    const s = $("sign").getBoundingClientRect(), o = scene.getBoundingClientRect();
    const p = bubbleSpot(scene, S.bpart, w, b.offsetHeight, [{ l: s.left - o.left, t: s.top - o.top, r: s.right - o.left, b: s.bottom - o.top }]);
    b.dataset.side = p.side;
    b.style.cssText = `width:${px(w)};left:${px(p.left)};top:${px(p.top)};--tx:${px(p.at)};--ty:${px(p.at)}`;
  }
  function hideBubble() { S.hintR = null; $("bubble").hidden = true; S.tok++; }
  scene.addEventListener("fit", placeBubble);          // after every re-fit of the world (a resize, the overlay, a taller HUD), never before it
  // The scene ends where the HUD really starts when the buttons wrap (phones, packs); never above --hud, so desktop framing stays pinned.
  new ResizeObserver(() => requestAnimationFrame(() => { scene.style.bottom = ""; scene.style.bottom = px(Math.max(parseFloat(getComputedStyle(scene).bottom), $("hud").offsetHeight)); })).observe($("hud"));

  // How to play: one sheet per chapter, because the cart does something new in each. Shown the first
  // time that chapter starts (start() calls howFor) and behind the button any time. Pip then shows the
  // new move on the real board (demo()).
  const HOW = {
    concrete: { key: "pip.howto.fence", title: "How to play: Build", sub: "Build the fence so the goat stays out of the corn.",
      steps: ["Tap the cart. You pick up a plank. Tap a part. The plank goes on.",
              "Every part needs the same planks. The sign says how many.",
              "Tap Done. If a part is short, the goat gets in. Fix it."] },
    packs: { key: "pip.howto.packs", title: "How to play: Packs", sub: "Now the planks come in packs. Get the packs first.",
      steps: ["A pack holds more than one plank. Look inside a pack.",
              "Tap the pack once for each pack you need. Then tap Bring it.",
              "Tap the cart, then a part. A whole pack goes on. Tap Done when every part is full."] },
    fix: { key: "pip.howto.fix", title: "How to play: Fix", sub: "The wind blew some planks out. Fill the gaps.",
      steps: ["Look at each part. Count the empty spaces, not the planks.",
              "Tap the plank once for each empty space. Then tap Bring it.",
              "Put the planks in the gaps. Tap Done."] },
    share: { key: "pip.howto.share", title: "How to play: Share", sub: "Share the planks out. You pick how many parts.",
      steps: ["The sign says how many planks. And how many go in each part.",
              "Tap + part until every plank has a part. Then tap Build.",
              "Fill every part. Tap Done when the cart is empty."] } };
  const howFor = mode => pip.howto({ ...HOW[mode], go: "Show me, Pip", say: lines => sayAll(lines), quiet: hush });
  $("howtob").onclick = () => howFor(sh().mode)();

  // --- Pip builds the first part herself on a fresh install, counting aloud, then hands over ------------
  // A child cannot read the rules; she can watch them. Code places and counts; the model is not involved.
  const GUIDE = { concrete: "pip.guide.fence", packs: "pip.guide.packs", fix: "pip.guide.fix", share: "pip.guide.share" };
  const guided = () => { try { return localStorage.getItem(GUIDE[sh().mode]) === "1"; } catch { return false; } };
  const guideDone = () => { try { localStorage.setItem(GUIDE[sh().mode], "1"); } catch {} };
  function speakNow(text) { return sound ? voiceNow(text, 0.95) : Promise.resolve(); }
  const COUNT = ["one", "two", "three", "four", "five", "six"];
  async function demo() {
    const s = sh(); if (lvl().some(e => ["place", "order", "parts"].includes(e.e))) return guideDone();
    const sl = ms => new Promise(r => setTimeout(r, matchMedia("(prefers-reduced-motion:reduce)").matches ? 0 : ms));
    const say = async (text, part, ms) => { const t0 = Date.now(); await bubble(text, "", part); await sl(Math.max(600, ms - (Date.now() - t0))); };
    await say("Watch me first.", 0, 1600);
    if (s.mode === "concrete") {
      await say("The sign says how many planks go in each part. I take a plank. I put it on this part.", 0, 3400);
      S.held = "plank"; render();
      for (let k = 0; k < s.per; k++) { if (!S.cart) break; place(0); await speakNow(COUNT[k] || ""); await sl(350); }
      S.held = null; render();
      bubble("This part is full. Now you do the other parts. Tap the cart. Then tap a part.", "", 0);
    } else if (s.mode === "packs") {
      await say("Now the planks come in packs. Look at the pack. I count the planks in it.", 0, 3000);
      for (let k = 0; k < s.pack; k++) { await speakNow(COUNT[k] || ""); await sl(300); }
      await say("A pack is more than one plank. I tap the pack once. That gets me a whole pack.", 0, 3200);
      S.slip = 1; render(); await sl(1200);
      bubble("Now you get the rest. How many planks does a part need? Tap the pack for each pack you need. Then tap Bring it.", "", 0);
    } else if (s.mode === "fix") {
      const p = Math.max(0, S.parts.findIndex(n => n < s.per)), gaps = s.per - S.parts[p];
      await say("The wind blew some planks out. This part has empty spaces at the top. I count the spaces, not the planks.", p, 3800);
      for (let k = 0; k < gaps; k++) { S.slip++; render(); await speakNow(COUNT[k] || ""); await sl(350); }
      await say("I tapped once for each empty space in this part.", p, 2400);
      bubble("Now you count the empty spaces in the other parts. Tap once for each space. Then tap Bring it.", "", p);
    } else if (s.mode === "share") {
      await say("The sign says how many planks we have. And how many go in each part. But not how many parts. We pick that.", 0, 4000);
      S.n = 1; mount(); await sl(600);
      await say("I added a part. It needs a full set of planks.", 0, 2600);
      bubble("Add a part for every full set of planks. Then tap Build.", "", 0);
    }
    guideDone();
  }
  // On a chapter's first level: the sheet, then Pip's demo once the sheet is closed.
  function maybeDemo() {
    if (guided() || S.done) return;
    const t = setInterval(() => { if (!document.getElementById("howto") && !S.done) { clearInterval(t); demo(); } }, 300);
  }

  // --- boot: restore the in-progress fence exactly, else the first plot ----------------------------
  const saved = load(); S.mastery = saved.mastery || {}; S.events = saved.events || [];   // history survives every branch below, ?node= included
  const ls = saved.events?.findLast?.(e => e.e === "level_start");
  const finale = () => { Object.assign(S, { node: "3x4_concrete", parts: [4, 4, 4] }); mount(); end(); };
  if (Q.get("node") && shape(Q.get("node"))?.chapter <= unlocked(S.mastery)) start(Q.get("node"));   // a locked chapter is not reachable by URL either
  else if (saved.ended) finale();
  else if (saved.build?.node && ls?.node === saved.build.node && shape(saved.build.node)) {
    Object.assign(S, { node: saved.build.node, parts: saved.build.parts, cart: saved.build.cart, n: saved.build.n || 0, at: ls.at || Date.now() });
    mount(); const L = lvl(), r = classify(L); S.done = r.id === "correct";
    // Put the goat back in the gap after a commit; re-say the hint that was still up (a place/remove hides it).
    if (!S.done && L.some(e => e.e === "commit")) goatToGap(r.counts);
    const h = L.findLast(e => e.e === "hint" || e.e === "place" || e.e === "remove");
    if (!S.done && h?.e === "hint" && TEMPLATES[h.id]) { S.probe = h.id === "ambiguous"; bubble(TEMPLATES[h.id][S.probe ? 1 : h.tier], "template", gapAt(r.counts)); }
    render(); arm(); howFor(sh().mode); maybeDemo();     // a reload before her first move still gets the sheet and the demo
  } else {
    const n = Object.values(S.mastery).some(v => v >= 1) ? next(S.mastery) : "3x4_concrete";
    n ? start(n) : finale();
  }

  // --- the judge's overlay (D-071): opt-in by ?judge=1 or the J key, loaded only then. The only place
  // digits appear off the sign. snap() is everything it shows, read live from the same state the game uses.
  const snap = () => { const L = lvl(), r = classify(L); return { node: S.node, events: L, result: r, payload: payload(r), hint: S.hint, mastery: S.mastery, plan: S.plan, show: S.show }; };
  async function judge() { J ??= (await import("/public/judge.mjs")).mount(snap); J.toggle(); }
  addEventListener("keydown", e => { if (e.key === "j" || e.key === "J") judge(); });
  if (Q.has("judge")) judge();
</script>
</body>
</html>
