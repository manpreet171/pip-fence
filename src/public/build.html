<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rung — build</title>
<style>
  :root{--ink:#22303a;--paper:#f6f1e6;--wood:#a9713d}
  html,body{margin:0;height:100%;font:16px/1.4 system-ui,sans-serif;color:var(--ink);background:var(--paper)}
  body{display:grid;grid-template-rows:auto 1fr auto;height:100dvh}
  header{padding:10px 16px;display:flex;justify-content:space-between;align-items:baseline}
  header b{font-size:18px}
  #scene{position:relative;overflow:hidden}
  .scene{background:linear-gradient(180deg,#8fd0f0 0%,#bfe6f7 55%,#dff0d8 100%)}
  footer{display:flex;gap:16px;align-items:center;padding:12px 16px;background:#fff;border-top:1px solid #e3ddd0}
  #cart{display:flex;gap:6px;align-items:center;padding:8px 12px;border:2px solid #d9cdb8;border-radius:12px;background:#fbf8f1;cursor:pointer;user-select:none}
  #cart.held{border-color:var(--wood);box-shadow:0 0 0 3px #f1dfc8}
  #cart img{height:26px}
  #log{margin-left:auto;font:12px/1.3 ui-monospace,monospace;color:#6b7480;max-height:48px;overflow:auto;width:40%}
</style>
</head>
<body>
<header><b>Build the fence</b><span id="task"></span></header>
<div id="scene" class="scene"></div>
<footer>
  <div id="cart" title="tap to hold a plank"><img src="/assets/fence/rail.png" alt=""><span id="cartn"></span></div>
  <pre id="log"></pre>
</footer>
<script type="module">
  import { mountScene, appendPlank, removePlank, onTap, FENCE_CSS, shape } from "/fence.mjs";
  document.head.insertAdjacentHTML("beforeend", `<style>${FENCE_CSS}</style>`);

  // Test harness for the scene primitives (mount / append / remove / one delegated tap).
  const node = new URLSearchParams(location.search).get("node") || "3x4_concrete";
  const s = shape(node);
  const scene = document.getElementById("scene");
  const g = mountScene(scene, s);
  document.getElementById("task").textContent = `${s.groups} parts, ${s.per} planks each`;

  const state = { cart: s.groups * s.per, parts: Array(s.groups).fill(0), held: false, events: [{ t: 0, e: "level_start", node }] };
  const t0 = performance.now(), log = (e) => { state.events.push({ t: Math.round(performance.now() - t0), ...e }); render(); };
  const cart = document.getElementById("cart");
  const render = () => {
    document.getElementById("cartn").textContent = `${state.cart} in cart`;
    cart.classList.toggle("held", state.held);
    document.getElementById("log").textContent = state.events.slice(-4).map(e => JSON.stringify(e)).join("\n");
  };
  cart.onclick = () => { if (state.cart > 0) { state.held = !state.held; if (state.held) log({ e: "plank_held" }); else render(); } };

  onTap(scene, (part, i) => {
    if (part === null) { if (state.held) log({ e: "place_failed", held: "plank" }); return; }
    if (i !== null && !state.held) {               // empty hand on a placed plank: it goes back to the cart
      removePlank(scene, part, i); state.parts[part]--; state.cart++;
      // keep indices dense: re-lay the rails above the removed one
      for (let k = i + 1; k <= state.parts[part]; k++) { removePlank(scene, part, k); appendPlank(scene, part, k - 1); }
      log({ e: "remove", unit: "plank", group: part, n_in_group: state.parts[part] }); return;
    }
    if (!state.held) { log({ e: "tap_count", group: part }); return; }
    appendPlank(scene, part, state.parts[part]); state.parts[part]++; state.cart--;
    if (state.cart === 0) state.held = false;
    log({ e: "place", unit: "plank", group: part, n_in_group: state.parts[part] });
  });
  render();
</script>
</body>
</html>
