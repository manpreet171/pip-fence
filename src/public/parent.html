<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pip · Fence — for grown-ups</title>
<link rel="icon" href="data:,">
<style>
  @font-face{font-family:"Fredoka";src:url(/assets/fonts/Fredoka.ttf) format("truetype");font-weight:300 700;font-display:swap}
  :root{--font-display:"Fredoka","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--ink:#22303a;--muted:#6f655a;--paper:#efe3cd;--cream:#f8f1e3;--wood:#a9702f;--wood2:#7d5122;--line:#d3bf9b}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100dvh;font:17px/1.5 var(--font-display);color:var(--ink);background:linear-gradient(180deg,#dff0d8,var(--paper) 220px);padding:20px 18px 40px}
  main{max-width:560px;margin:0 auto;display:grid;gap:16px}
  h1{font-size:26px;margin:0 0 4px;color:var(--wood2)}
  .sub{color:var(--muted);margin:0 0 8px;font-size:15px}
  section{background:var(--cream);border:2px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 4px 0 var(--line),0 8px 16px rgba(60,40,20,.12)}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:700}
  .big{font-size:40px;font-weight:700;line-height:1.1;color:var(--wood2)}
  .big small{font-size:16px;font-weight:600;color:var(--ink);margin-left:8px}
  p{margin:6px 0}
  .ask{margin-top:12px;padding:14px 16px;border-radius:12px;background:var(--paper);border-left:4px solid var(--wood);font-size:19px;font-weight:600}
  .ask .k{display:block;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
  ul{margin:6px 0 0;padding-left:18px}
  li{margin:2px 0}
  a{color:var(--wood2)}
  .foot{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <div><h1>For grown-ups</h1><p class="sub">What happened on the plots, and one thing to ask out loud. Everything here stays on this device.</p></div>
  <section><h2>This week</h2><div class="big" id="n"></div><p id="mastered" class="foot"></p></section>
  <section id="open"><h2>This week's note</h2><p id="what"></p><div class="ask" id="ask" hidden><span class="k">Ask out loud</span><div id="q"></div></div><p class="foot" id="src" hidden></p></section>
  <p class="foot"><a href="/build">Back to the plots</a></p>
</main>
<script type="module">
  import { classify, shape, IDS, level } from "/fence.mjs";
  import { note } from "/buddy.mjs";
  // The note is written from a summary the model is handed (buddy.mjs: fence names, the open misconception
  // in PARENT_WORDS, the tier reached, days played) — never the event log or a count. Any miss → the fixed
  // sentences, which are the same PARENT_WORDS. One source of truth for both.
  const name = node => { const s = shape(node); return `${s.groups} parts of ${s.per}${s.mode === "packs" ? " (packs)" : ""}`; };
  let d = {}; try { d = JSON.parse(localStorage.getItem("rung.v1")) || {}; } catch {}
  const levels = [];
  for (const e of d.events || []) { if (e.e === "level_start") levels.push([]); if (levels.length) levels.at(-1).push(e); }
  const res = levels.map(level).flatMap(L => { try { return [{ node: L[0].node, at: L[0].at || 0, r: classify(L), hints: L.filter(e => e.e === "hint") }]; } catch { return []; } });
  const week = Date.now() - 7 * 864e5;
  const done = res.filter(x => x.r.id === "correct" && x.at >= week);
  document.getElementById("n").innerHTML = `${done.length}<small>${done.length === 1 ? "fence finished" : "fences finished"}</small>`;
  // The lists are the week's too, so the count, the lines and the note agree (mastery is all-time; the game keeps it).
  const names = xs => [...new Set(xs.map(x => name(x.node)))];
  const solo = names(done.filter(x => !x.hints.length)), helped = names(done.filter(x => x.hints.length));
  document.getElementById("mastered").textContent =
    (solo.length ? `Finished without a hint: ${solo.join(", ")}. ` : "") + (helped.length ? `Finished with a hint: ${helped.join(", ")}.` : "");
  // The most recent level that needed a hint or ended on a named misconception is the one to talk about.
  const recent = [...res].reverse().find(x => x.hints.length || IDS.includes(x.r.id));
  const id = recent && (IDS.includes(recent.r.id) ? recent.r.id : recent.hints.at(-1).id);
  const open_id = id && !(recent !== res.at(-1) && res.at(-1).r.id === "correct") ? id : null;
  const tier = Math.min(3, Math.max(1, ...(recent?.hints || []).filter(h => h.id === open_id).map(h => h.tier)));
  const days = Math.min(7, new Set(res.filter(x => x.at >= week).map(x => new Date(x.at).toDateString())).size);
  const what = document.getElementById("what"), $ = id => document.getElementById(id);
  if (!res.length) what.textContent = "No fences yet. The first plot is waiting.";   // nothing to write about: no call
  else {
    what.textContent = "Writing your note…";
    const out = await note({ open_id, tier, solo, helped, days });
    what.textContent = out.note; $("ask").hidden = false; $("q").textContent = out.question;
    if (new URLSearchParams(location.search).has("debug")) { $("src").hidden = false; $("src").textContent = out.source === "model" ? "from the model" : "standard note"; }
  }
</script>
</body>
</html>
